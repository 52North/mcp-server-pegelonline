name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - name: Import the server without the dev dependencies
        run: uv run --locked --no-dev --isolated python -c "import pegelonline_mcp.asgi"
      - name: Check that packaging/requirements.txt matches uv.lock
        if: matrix.python == '3.12'
        run: |
          make -C packaging requirements
          git diff --exit-code packaging/requirements.txt
