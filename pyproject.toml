[project]
name = "mcp-server-pegelonline-dict-api"
version = "0.1.0"
description = "An MCP Server that provides tools to search for gauge stations in Germany using the Pegelonline Dict API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.3.0",
    "fastmcp[apps]>=3.4.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "syrupy>=6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# server.py and helpers.py live in the project root
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
