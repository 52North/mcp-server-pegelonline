[project]
name = "mcp-server-pegelonline"
version = "0.1.0"
description = "An MCP server for gauge stations on German federal waterways: it finds stations via the Pegelonline Dict API and reads their metadata and measurements from the official Pegelonline REST API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6,<5",
    "httpx2>=2.16.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
]

[project.scripts]
mcp-server-pegelonline = "pegelonline_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pegelonline_mcp"
module-root = ""

[dependency-groups]
dev = [
    "fastmcp[apps]>=4.1.6,<5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "syrupy>=6.1.1",
]
sbom = [
    "cyclonedx-bom>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::fastmcp.exceptions.FastMCPDeprecationWarning"]
# respx mocks only httpx: tests/httpx2_alias.py points it at httpx2 and must
# load before the respx plugin
pythonpath = ["tests"]
addopts = ["-p", "httpx2_alias"]

[tool.ruff]
src = [".", "tests"]

[tool.mypy]
files = ["pegelonline_mcp", "tests"]
check_untyped_defs = true
